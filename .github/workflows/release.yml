name: Release validation

on:
  workflow_dispatch:
    inputs:
      publish_github:
        description: Create a GitHub Release (owner setup and existing version tag required)
        type: boolean
        default: false
      publish_pypi:
        description: Publish to PyPI (trusted publisher and owner setup required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,release]"
      - name: Complete release-confidence gate (no publication)
        run: python -m scripts.quality
      - name: Validate publication context or dry-run metadata
        run: python -m scripts.release --publication-check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          SABLE_RELEASE_ENABLED: ${{ vars.SABLE_RELEASE_ENABLED }}
          SABLE_PYPI_ENABLED: ${{ vars.SABLE_PYPI_ENABLED }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  verify-artifact:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-${{ github.sha }}
          path: release-dist
      - name: Verify downloaded artifacts even during dry runs
        working-directory: release-dist
        run: sha256sum --check --strict SHA256SUMS.txt

  github-release:
    needs: verify-artifact
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_github &&
      startsWith(github.ref, 'refs/tags/v') && vars.SABLE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-${{ github.sha }}
          path: release-dist
      - name: Verify exact validated artifacts
        working-directory: release-dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Create approved release without creating a tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-dist/*.whl release-dist/*.tar.gz release-dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG"
          --notes-file release-dist/RELEASE_NOTES.md

  pypi:
    needs: verify-artifact
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_pypi &&
      startsWith(github.ref, 'refs/tags/v') && vars.SABLE_PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-${{ github.sha }}
          path: release-dist
      - name: Verify exact validated artifacts
        working-directory: release-dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Select distributions only
        run: |
          mkdir publish
          cp release-dist/*.whl release-dist/*.tar.gz publish/
      - name: Publish approved artifacts using OIDC (no static token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish/
          attestations: true
