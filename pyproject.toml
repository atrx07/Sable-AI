[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-ai-agent"
dynamic = ["version"]
description = "Local-first agentic coding runtime with bounded tools and deterministic verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0,<3"]
authors = [{name = "atrx07"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agentic-ai", "coding-agent", "developer-tools", "terminal", "termux", "groq"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/atrx07/Sable-AI"
Source = "https://github.com/atrx07/Sable-AI"
Issues = "https://github.com/atrx07/Sable-AI/issues"
Documentation = "https://github.com/atrx07/Sable-AI/tree/main/docs"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.7,<0.17", "coverage>=7.16.1,<8",
    "bandit>=1.9.4,<2", "pip-audit>=2.10.1,<3", "PyYAML>=6.0.3,<7",
    "tomli>=2.2,<3; python_version < '3.11'",
]
release = ["build>=1.6.1,<2", "twine>=7,<8"]

[project.scripts]
sable = "sable.cli_app:main"

[tool.setuptools.packages.find]
include = ["sable*"]

[tool.setuptools]
include-package-data = false
py-modules = []
package-dir = {sable = "sable"}

[tool.setuptools.dynamic]
version = {attr = "sable._version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100
# Canonical eval fixtures deliberately contain formatting/error/patch targets.
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["sable"]

[tool.coverage.report]
precision = 2
# Initial Windows measurement: 82.50%; Linux is independently checked in CI.
fail_under = 82
