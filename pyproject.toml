[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-ai-agent"
dynamic = ["version"]
description = "Bounded, Termux-first agentic coding assistant powered by Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0,<3"]
authors = [{name = "atrx07"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["coding-agent", "terminal", "termux", "groq"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/atrx07/Sable-AI"
Source = "https://github.com/atrx07/Sable-AI"
Issues = "https://github.com/atrx07/Sable-AI/issues"
Documentation = "https://github.com/atrx07/Sable-AI/tree/main/docs"

[project.optional-dependencies]
dev = ["ruff>=0.16.7,<0.17"]
release = ["build>=1.6.1,<2", "twine>=7,<8"]

[project.scripts]
sable = "sable.cli_app:main"

[tool.setuptools.packages.find]
include = ["sable*"]

[tool.setuptools]
include-package-data = false
py-modules = []
package-dir = {sable = "sable"}

[tool.setuptools.dynamic]
version = {attr = "sable._version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100
# Canonical eval fixtures deliberately contain formatting/error/patch targets.
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
